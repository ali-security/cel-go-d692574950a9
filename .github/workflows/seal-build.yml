# Seal build workflow for github.com/google/cel-go.
# Upstream has no GitHub Actions CI (it runs Google Cloud Build: cloudbuild.yaml
# with golang:1.21.1 + `bazel test ...`), so this workflow is authored from
# scratch: it packs the root module zip exactly as proxy.golang.org serves it
# (golang.org/x/mod/zip.CreateFromDir) and runs the root module's Go test suite
# (`go test ./...`, the command the README documents) against the vendored deps.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated Go test names to run (empty = full suite)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  module-zip:
    name: module zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: false
      - name: Build x/mod zip helper
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helper"
          cd "$RUNNER_TEMP/helper"
          cat > main.go <<'EOF'
          package main

          import (
                  "log"
                  "os"

                  "golang.org/x/mod/module"
                  "golang.org/x/mod/zip"
          )

          func main() {
                  if len(os.Args) != 5 {
                      log.Fatal("usage: create_mod <module-path> <version> <source-dir> <output-zip>")
                  }
                  m := module.Version{Path: os.Args[1], Version: os.Args[2]}
                  f, err := os.Create(os.Args[4])
                  if err != nil {
                      log.Fatal(err)
                  }
                  defer f.Close()
                  if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                      log.Fatal(err)
                  }
                  log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          go mod init helper
          go get golang.org/x/mod@v0.20.0
          go build -o "$RUNNER_TEMP/create_mod" .
      - name: Create module zip
        run: |
          set -euo pipefail
          # Pack from a copy of the module tree without this seal-only workflow,
          # so the zip keeps the public member set (upstream's own .github files stay).
          mkdir -p "$RUNNER_TEMP/modsrc" dist
          tar --exclude=./.git --exclude=./dist -cf - . | tar -xf - -C "$RUNNER_TEMP/modsrc"
          rm -f "$RUNNER_TEMP/modsrc/.github/workflows/seal-build.yml"
          if [ -z "$(ls -A "$RUNNER_TEMP/modsrc/.github/workflows")" ]; then rmdir "$RUNNER_TEMP/modsrc/.github/workflows"; fi
          "$RUNNER_TEMP/create_mod" github.com/google/cel-go v0.22.1 "$RUNNER_TEMP/modsrc" dist/v0.22.1.zip
          unzip -l dist/v0.22.1.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: dist/v0.22.1.zip
          if-no-files-found: error

  test:
    name: go test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 1.22 = the release-era toolchain; 1.23.0 = go.mod's toolchain directive.
        go: ['1.22', '1.23.0']
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go version
      - name: Build
        run: go build ./...
      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -o pipefail
          if [ -n "$TEST_FILTER" ]; then
            go test -v -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee test.log
            for t in $TEST_FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" test.log || { echo "selected test $t did not run"; exit 1; }
            done
          else
            go test -v ./... 2>&1 | tee test.log
          fi
          rc=$?
          echo "================ TEST SUMMARY (Go ${{ matrix.go }}) ================"
          echo "passed:  $(grep -cE '^[[:space:]]*--- PASS' test.log)"
          echo "failed:  $(grep -cE '^[[:space:]]*--- FAIL' test.log)"
          echo "skipped: $(grep -cE '^[[:space:]]*--- SKIP' test.log)"
          if grep -qE '^[[:space:]]*--- SKIP' test.log; then grep -E -A1 '^[[:space:]]*--- SKIP' test.log; fi
          grep -E '^(ok|FAIL|\?)[[:space:]]' test.log
          exit $rc
